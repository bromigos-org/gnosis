name: CI

on:
  pull_request:
  push:
    branches:
      - main

# PR runs are disposable, so keep only the newest per branch. Main pushes get
# a group per commit instead: GitHub holds at most one pending run per group
# and a newer run evicts the pending one, so a shared main group would drop
# intermediate merges along with their post-merge tests and immutable
# sha-<sha> image. Every main commit therefore runs. The homelab deploys by
# digest, not :latest, so an out-of-order :latest move cannot roll it back.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Format check
        run: uv run ruff format --check

      - name: Type check
        run: uv run basedpyright

      - name: Tests
        run: uv run pytest -q

  # bromigos-org fork: the homelab gnosis Deployment (bromigos-org/homelab
  # helm/gnosis) pulls ghcr.io/bromigos-org/gnosis pinned by digest. This job
  # publishes the immutable sha-<sha> tag, gates it on the Trivy scan, then
  # moves :latest. To roll a build, copy the digest from the job summary into
  # homelab helm/gnosis/values.yaml image.digest. Upstream's Artifact Registry
  # job (nolgiainc GCP projects) is dropped here: this fork cannot and must not
  # push there. Runs on Blacksmith, never the homelab runners: this repo is
  # public, and a fork PR must not run in a privileged homelab pod.
  docker:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/bromigos-org/gnosis
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push the immutable sha- tag only; :latest moves after the image scan.
      # linux/amd64: the homelab pins gnosis to an amd64 node.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      # Trivy gate: fails on a CRITICAL with a fix available, reports HIGH
      # into the job summary. Allowlist: .trivyignore.yaml.
      - name: Scan image
        run: .github/scripts/image-scan.sh "${IMAGE}@${{ steps.build.outputs.digest }}" "ghcr gnosis sha-${{ github.sha }}"

      - name: Promote :latest
        run: docker buildx imagetools create --tag "${IMAGE}:latest" "${IMAGE}@${{ steps.build.outputs.digest }}"

      - name: Record digest
        run: |
          {
            echo "### ghcr.io/bromigos-org/gnosis"
            echo ""
            echo "- tag: \`sha-${{ github.sha }}\`"
            echo "- digest: \`${{ steps.build.outputs.digest }}\`"
            echo ""
            echo "Pin it in bromigos-org/homelab helm/gnosis/values.yaml (image.digest)."
          } >> "$GITHUB_STEP_SUMMARY"
