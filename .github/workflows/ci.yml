name: CI

on:
  pull_request:
  push:
    branches:
      - main

# PR runs are disposable, so keep only the newest per branch. Main pushes get
# a group per commit instead: GitHub holds at most one pending run per group
# and a newer run evicts the pending one, so a shared main group would drop
# intermediate merges along with their post-merge tests and immutable
# sha-<sha> image. Every main commit therefore runs. Deployments pin the image
# by digest, not :latest, so an out-of-order :latest move cannot roll one back.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Format check
        run: uv run ruff format --check

      - name: Type check
        run: uv run basedpyright

      - name: Tests
        run: uv run pytest -q

  # Publishes ghcr.io/bromigos-org/gnosis: the immutable sha-<sha> tag, gated
  # on the Trivy scan, then :latest. Deployments pin the image by digest: copy
  # it from the job summary. Upstream's Artifact Registry job is dropped here:
  # this fork can't push there. Runs on hosted runners (Blacksmith), never
  # self-hosted ones: this repo is public, and a fork PR must not run on a
  # privileged self-hosted runner.
  docker:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/bromigos-org/gnosis
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push the immutable sha- tag only; :latest moves after the image scan.
      # linux/amd64 only.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      # Trivy gate: fails on a CRITICAL with a fix available, reports HIGH
      # into the job summary. Allowlist: .trivyignore.yaml.
      - name: Scan image
        run: .github/scripts/image-scan.sh "${IMAGE}@${{ steps.build.outputs.digest }}" "ghcr gnosis sha-${{ github.sha }}"

      - name: Promote :latest
        run: docker buildx imagetools create --tag "${IMAGE}:latest" "${IMAGE}@${{ steps.build.outputs.digest }}"

      - name: Record digest
        run: |
          {
            echo "### ghcr.io/bromigos-org/gnosis"
            echo ""
            echo "- tag: \`sha-${{ github.sha }}\`"
            echo "- digest: \`${{ steps.build.outputs.digest }}\`"
            echo ""
            echo "Pin this digest where you deploy gnosis."
          } >> "$GITHUB_STEP_SUMMARY"
